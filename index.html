  closeDaySummaryModal() {
    const modal = document.getElementById('day-summary-modal');
    if (modal) modal.classList.remove('open');
  }

  renderModalContent() {
    const g = this.game;
    const body = document.getElementById('modal-body-content');
    body.innerHTML = '';

    // 1. TAB STORY (5 CHƯƠNG NGẮN GỌN, TRỰC QUAN)
    if (this.activeModalTab === 'story') {
      window.GAME_CONFIG.STORY_CHAPTERS.forEach(chap => {
        const isCurrent = chap.chapter === g.storyChapter;
        const isDone = chap.chapter < g.storyChapter;
        const canClaim = isCurrent && chap.check(g);
        const npc = window.GAME_CONFIG.NPCS[chap.npc] || window.GAME_CONFIG.NPCS.lumia;

        const card = document.createElement('div');
        card.className = 'shop-card';
        card.style.gridColumn = '1 / -1';
        if (isCurrent) card.style.borderColor = '#6a1b9a';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div class="shop-card-top">
              <div class="shop-icon">${npc.icon}</div>
              <div>
                <div class="shop-title">${chap.title}</div>
                <div class="shop-desc">${chap.goalDesc}</div>
                <div class="shop-meta" style="margin-top:2px;">
                  ${isDone ? '✔ Đã hoàn thành' : (isCurrent ? `Tiến độ: ${chap.progressText(g)}` : '🔒 Mở khóa sau chương trước')}
                </div>
              </div>
            </div>
            <div>
              ${canClaim
                ? `<button class="nav-icon-btn gold-btn">🎁 Nhận Thưởng (+${chap.rewardGold}G)</button>`
                : `<span style="font-size:11.5px; font-weight:800; color:#6a1b9a;">💰+${chap.rewardGold}G | 🌠+${chap.rewardStars}</span>`}
            </div>
          </div>
        `;
        if (canClaim) {
          card.querySelector('button').onclick = () => {
            g.completeStoryChapter();
            this.renderModalContent();
          };
        }
        body.appendChild(card);
      });
      return;
    }

    // 2. TAB COMMISSIONS (ỦY THÁC DÂN LÀNG)
    if (this.activeModalTab === 'commissions') {
      g.quests.forEach(q => {
        const npc = window.GAME_CONFIG.NPCS[q.npc] || window.GAME_CONFIG.NPCS.bamai;
        const current = Math.min(q.target, g.getQuestProgress(q));
        const isDone = current >= q.target;

        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${npc.icon}</div>
            <div>
              <div class="shop-title">${q.title}</div>
              <div class="shop-meta">Tiến độ: ${current}/${q.target}</div>
              <div class="shop-desc">Thưởng: 💰${q.rewardGold}G + 🌠${q.rewardStars} Sao</div>
            </div>
          </div>
          <button class="nav-icon-btn ${isDone ? 'gold-btn' : ''}" ${!isDone ? 'disabled' : ''}>
            ${isDone ? '🎁 Nhận Phần Thưởng' : `Đang thực hiện (${current}/${q.target})`}
          </button>
        `;
        if (isDone) {
          card.querySelector('button').onclick = () => {
            g.claimQuest(q.id);
            this.renderModalContent();
          };
        }
        body.appendChild(card);
      });
      return;
    }

    // 3. TAB SEEDS
    if (this.activeModalTab === 'seeds') {
      const shortHints = {
        radish: 'Lớn siêu tốc 15s',
        strawberry: 'Tự ra quả nhiều lần',
        pumpkin: 'Trồng 2x2 tạo quả Khổng Lồ',
        sunflower: 'Tăng +30% tốc độ 8 ô cạnh',
        eggplant: 'Lớn nhanh x2.2 vào ban đêm',
        starfruit: 'Tỉ lệ đột biến Ánh Sao x2'
      };
      Object.values(window.GAME_CONFIG.CROPS).forEach(crop => {
        const owned = g.seeds[crop.id] || 0;
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${this.pixelIconHtml(crop.id, crop.emoji, 26)}</div>
            <div>
              <div class="shop-title">${crop.name}</div>
              <div class="shop-meta">⏱ ${crop.growTime}s • 💰 Bán ${crop.sellPrice}G</div>
              <div class="shop-desc">${shortHints[crop.id] || ''}</div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11.5px; font-weight:800;">Có: ${owned}</span>
            <div style="display:flex; gap:5px;">
              <button class="nav-icon-btn" data-buy="${crop.id}" data-qty="1">+1 (${crop.seedPrice}G)</button>
              <button class="nav-icon-btn gold-btn" data-buy="${crop.id}" data-qty="5">+5 (${crop.seedPrice * 5}G)</button>
            </div>
          </div>
        `;
        card.querySelectorAll('button').forEach(btn => {
          btn.onclick = () => g.buySeed(btn.dataset.buy, parseInt(btn.dataset.qty, 10));
        });
        body.appendChild(card);
      });
      return;
    }

    // 4. TAB ANIMALS & DEVICES
    if (this.activeModalTab === 'animals') {
      Object.values(window.GAME_CONFIG.ANIMALS).forEach(anim => {
        const count = g.animals.filter(a => a.typeId === anim.id).length;
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${anim.icon}</div>
            <div>
              <div class="shop-title">${anim.name}</div>
              <div class="shop-meta">Tạo ${anim.produceIcon} (${anim.produceValue}G) mỗi ${anim.produceInterval}s</div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11.5px; font-weight:800;">Đang nuôi: ${count}</span>
            <button class="nav-icon-btn gold-btn">Mua (${anim.price}G)</button>
          </div>
        `;
        card.querySelector('button').onclick = () => g.buyAnimal(anim.id);
        body.appendChild(card);
      });

      Object.values(window.GAME_CONFIG.DEVICES).forEach(dev => {
        const count = g.devices[dev.id] || 0;
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${this.pixelIconHtml(dev.id, dev.icon, 26)}</div>
            <div>
              <div class="shop-title">${dev.name}</div>
              <div class="shop-meta">${dev.id === 'sprinkler' ? 'Tự động tưới nước vùng 3x3' : 'Tăng x2 đột biến vùng 3x3'}</div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11.5px; font-weight:800;">Trong túi: ${count}</span>
            <button class="nav-icon-btn">Mua (${dev.price}G)</button>
          </div>
        `;
        card.querySelector('button').onclick = () => g.buyDevice(dev.id);
        body.appendChild(card);
      });
      return;
    }

    // 5. TAB UPGRADES
    if (this.activeModalTab === 'upgrades') {
      window.GAME_CONFIG.UPGRADES.forEach(up => {
        const isOwned = !!g.upgrades[up.id];
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${up.icon}</div>
            <div>
              <div class="shop-title">${up.name}</div>
              <div class="shop-desc">${up.desc}</div>
            </div>
          </div>
          <button class="nav-icon-btn ${isOwned ? '' : 'gold-btn'}" ${isOwned ? 'disabled' : ''}>
            ${isOwned ? '✔ Đã Sở Hữu' : `Nâng Cấp (${up.price}G)`}
          </button>
        `;
        if (!isOwned) {
          card.querySelector('button').onclick = () => g.buyUpgrade(up.id);
        }
        body.appendChild(card);
      });
      return;
    }

    // 6. TAB STAR SHOP
    if (this.activeModalTab === 'starshop') {
      window.GAME_CONFIG.STAR_SHOP_ITEMS.forEach(item => {
        const canBuy = g.starShards >= item.starCost;
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${item.icon}</div>
            <div>
              <div class="shop-title">${item.name}</div>
              <div class="shop-desc">${item.desc}</div>
            </div>
          </div>
          <button class="nav-icon-btn purple-btn" ${!canBuy ? 'disabled' : ''}>
            🌠 Dùng ${item.starCost} Mảnh Sao
          </button>
        `;
        if (canBuy) {
          card.querySelector('button').onclick = () => g.useStarShopItem(item.id);
        }
        body.appendChild(card);
      });
      return;
    }

    // 7. TAB BUNDLES (ĐỀN THỜ ĐẠI THỤ)
    if (this.activeModalTab === 'bundles') {
      window.GAME_CONFIG.BUNDLES.forEach(b => {
        const isDone = g.completedBundles.includes(b.id);
        const reqListHtml = Object.entries(b.requirements).map(([itemKey, needQty]) => {
          const haveQty = g.inventory[itemKey] || 0;
          const ok = haveQty >= needQty;
          return `<span style="color:${ok ? '#2e7d32' : '#c62828'}; font-weight:700;">${this.pixelIconHtml(itemKey, g.getItemIcon(itemKey), 15)} ${g.getItemLabel(itemKey)}: ${haveQty}/${needQty}</span>`;
        }).join(' &nbsp;•&nbsp; ');

        const canComplete = !isDone && Object.entries(b.requirements).every(([k, q]) => (g.inventory[k] || 0) >= q);

        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div>
            <div class="shop-card-top">
              <div class="shop-icon">${b.icon}</div>
              <div>
                <div class="shop-title">${b.name}</div>
                <div class="shop-meta">🎁 ${b.rewardText}</div>
              </div>
            </div>
            <div style="background:#f3e2b8; padding:6px 8px; border-radius:6px; font-size:11.5px; margin-top:6px;">
              ${reqListHtml}
            </div>
          </div>
          <button class="nav-icon-btn ${isDone ? '' : 'gold-btn'}" ${(!canComplete || isDone) ? 'disabled' : ''}>
            ${isDone ? '✔ Đã Hiến Tế' : '🏛️ Dâng Vật Phẩm'}
          </button>
        `;
        if (canComplete && !isDone) {
          card.querySelector('button').onclick = () => g.completeBundle(b.id);
        }
        body.appendChild(card);
      });
      return;
    }

    // 8. TAB KITCHEN
    if (this.activeModalTab === 'kitchen') {
      window.GAME_CONFIG.RECIPES.forEach(rec => {
        const ingText = Object.entries(rec.ingredients)
          .map(([k, q]) => `${g.getItemLabel(k)} (${g.inventory[k] || 0}/${q})`)
          .join(' + ');
        const canCook = Object.entries(rec.ingredients).every(([k, q]) => (g.inventory[k] || 0) >= q);

        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div>
            <div class="shop-card-top">
              <div class="shop-icon">${rec.icon}</div>
              <div>
                <div class="shop-title">${rec.name}</div>
                <div class="shop-meta">💰 Bán ${rec.sellPrice}G | ⚡ Hồi ${rec.energyRestore}</div>
              </div>
            </div>
            <div style="font-size:11px; font-weight:700; color:#6b3b06; margin-top:6px;">Cần: ${ingText}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="nav-icon-btn gold-btn" data-act="sell" ${!canCook ? 'disabled' : ''}>Bán (+${rec.sellPrice}G)</button>
            <button class="nav-icon-btn" data-act="eat" ${!canCook ? 'disabled' : ''}>Ăn (⚡+${rec.energyRestore})</button>
          </div>
        `;
        card.querySelector('[data-act="sell"]').onclick = () => g.cookRecipe(rec, false);
        card.querySelector('[data-act="eat"]').onclick = () => g.cookRecipe(rec, true);
        body.appendChild(card);
      });
      return;
    }

    // 9. TAB INVENTORY
    if (this.activeModalTab === 'inventory') {
      const entries = Object.entries(g.inventory).filter(([, qty]) => qty > 0);
      if (entries.length === 0) {
        body.innerHTML = `<div class="banner-box" style="text-align:center; padding:24px;">
          <h3>🧺 Kho Nông Sản Đang Trống</h3>
          <p style="margin-top:4px; font-size:12px;">Hãy ra cánh đồng thu hoạch cây chín, nhặt trứng gà hoặc câu cá Koi nhé!</p>
        </div>`;
        return;
      }

      entries.forEach(([key, qty]) => {
        const unitPrice = g.getItemSellPrice(key);
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${this.pixelIconHtml(key, g.getItemIcon(key), 26)}</div>
            <div>
              <div class="shop-title">${g.getItemLabel(key)}</div>
              <div class="shop-meta">Số lượng: ${qty} • Giá: ${unitPrice}G</div>
            </div>
          </div>
          <button class="nav-icon-btn gold-btn">Bán Hết (+${(qty * unitPrice).toLocaleString('vi-VN')}G)</button>
        `;
        card.querySelector('button').onclick = () => g.sellInventoryItem(key);
        body.appendChild(card);
      });
      return;
    }

    // 10. TAB ALMANAC (BÁCH KHOA)
    if (this.activeModalTab === 'almanac') {
      const allKeys = [
        ...Object.keys(window.GAME_CONFIG.CROPS),
        'egg', 'milk', 'honey', 'fish',
        ...window.GAME_CONFIG.RECIPES.map(r => r.id)
      ];
      const discoveredCount = allKeys.filter(k => (g.discovered[k] || 0) > 0).length;
      const pct = Math.round((discoveredCount / allKeys.length) * 100);

      const header = document.createElement('div');
      header.className = 'banner-box';
      header.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:4px;">
          <span>📚 Tiến độ Bách Khoa Nông Trại</span>
          <span>${discoveredCount}/${allKeys.length} (${pct}%)</span>
        </div>
        <div class="bar-track" style="height:9px;">
          <div class="bar-fill-energy" style="width:${pct}%;"></div>
        </div>
      `;
      body.appendChild(header);

      allKeys.forEach(k => {
        const count = g.discovered[k] || 0;
        const isFound = count > 0;
        const recipeObj = window.GAME_CONFIG.RECIPES.find(r => r.id === k);
        const label = recipeObj ? recipeObj.name : g.getItemLabel(k);
        const iconHtml = recipeObj ? recipeObj.icon : this.pixelIconHtml(k, g.getItemIcon(k), 24);

        const card = document.createElement('div');
        card.className = 'shop-card';
        card.style.opacity = isFound ? '1' : '0.55';
        card.innerHTML = `
          <div class="shop-card-top">
            <div class="shop-icon">${iconHtml}</div>
            <div>
              <div class="shop-title">${isFound ? label : '???'}</div>
              <div class="shop-meta">${isFound ? `Đã thu thập: ${count}` : 'Chưa khám phá'}</div>
            </div>
          </div>
        `;
        body.appendChild(card);
      });
      return;
    }

    // 11. TAB RULES (4 THẺ TRỰC QUAN NGẮN GỌN)
    if (this.activeModalTab === 'rules') {
      body.innerHTML = `
        <div class="shop-card">
          <div class="shop-title">✨ 1. Điều Khiển 1-Chạm & Kéo Chuột</div>
          <div class="shop-desc">Chỉ cần <b>Click hoặc Giữ & Kéo chuột trái</b> lên ô đất để tự động Cuốc → Gieo → Tưới → Thu hoạch!</div>
        </div>
        <div class="shop-card">
          <div class="shop-title">🎃 2. Cây Khổng Lồ 2×2 (×3 Sản Lượng)</div>
          <div class="shop-desc">Trồng 4 cây cùng loại tạo thành ô vuông <b>2×2</b> liền kề nhau để hợp nhất thành Cây Khổng Lồ!</div>
        </div>
        <div class="shop-card">
          <div class="shop-title">🌠 3. Cây Ánh Sao (×4 Giá Trị)</div>
          <div class="shop-desc">Đặt <b>Đèn Đom Đóm</b> gần cây hoặc dùng <b>Mảnh Sao Băng</b> trong Chợ Phép Thuật để đột biến cây!</div>
        </div>
        <div class="shop-card">
          <div class="shop-title">🏛️ 4. Đánh Thức Cây Đại Thụ</div>
          <div class="shop-desc">Nộp nông sản tại <b>Đền Thờ</b> và hoàn thành <b>5 Chương Nhiệm Vụ</b> để tăng vĩnh viễn giá bán!</div>
        </div>
        <div class="banner-box" style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:800; font-size:12.5px;">💾 Quản lý dữ liệu lưu tự động</span>
          <div style="display:flex; gap:8px;">
            <button id="btn-export-save" class="nav-icon-btn gold-btn">⬇ Tải File Save (.json)</button>
            <button id="btn-reset-save" class="nav-icon-btn" style="background:#b71c1c;">🔄 Chơi Lại</button>
          </div>
        </div>
      `;
      document.getElementById('btn-export-save').onclick = () => g.exportSaveJson();
      document.getElementById('btn-reset-save').onclick = () => g.resetGameData();
    }
  }
}

window.GameUI = GameUI;


/**
 * ============================================================================
 * THUNG LŨNG SAO BĂNG (STARLIGHT VALLEY v4.0 - COZY MINIMALIST EDITION)
 * js/main.js - Vòng lặp Game Loop, Tương tác Kéo Chuột Mượt Mà & Điều Hướng Gọn Gàng
 * ============================================================================
 */

class StarlightFarmGame {
  constructor() {
    this.canvas = document.getElementById('game-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.world = new window.FarmWorld();
    this.canvas.width = this.world.cols * this.world.tileSize;
    this.canvas.height = this.world.rows * this.world.tileSize;

    this.player = new window.PlayerFarmer(3.5 * this.world.tileSize, 3.5 * this.world.tileSize);
    this.cat = new window.PetCat(2.5 * this.world.tileSize, 3.6 * this.world.tileSize);
    this.animals = [
      new window.FarmAnimal('chicken', 520, 140)
    ];

    this.gold = 260;
    this.starShards = 2;
    this.energy = 100;
    this.maxEnergy = 100;
    this.level = 1;
    this.xp = 0;
    this.xpToNext = 100;

    this.storyChapter = 1;
    this.treeLevel = 1;
    this.completedBundles = [];

    this.smartMode = true;
    this.selectedTool = 'smart';
    this.selectedSeed = 'radish';

    this.seeds = {
      radish: 6,
      strawberry: 2,
      pumpkin: 1,
      sunflower: 1,
      eggplant: 0,
      starfruit: 0
    };
    this.devices = {
      sprinkler: 1,
      lantern: 0
    };
    this.upgrades = {};
    this.inventory = {};
    this.discovered = { radish: 1 };
    this.stats = {
      harvested: 0,
      mutatedHarvested: 0,
      fishCaught: 0,
      dishesCooked: 0
    };

    this.dailyStats = {
      goldEarned: 0,
      harvested: 0
    };

    this.quests = [
      { id: 'q1', npc: 'bamai', title: 'Bà Mai: Thu hoạch 5 nông sản', type: 'harvest', target: 5, rewardGold: 160, rewardStars: 1 },
      { id: 'q2', npc: 'bactam', title: 'Bác Tâm: Cây Đột Biến / Khổng Lồ', type: 'mutated', target: 1, rewardGold: 320, rewardStars: 2 },
      { id: 'q3', npc: 'laokien', title: 'Lão Kiên: Câu 2 Cá Chép Koi', type: 'fish', target: 2, rewardGold: 240, rewardStars: 1 },
      { id: 'q4', npc: 'colinh', title: 'Cô Linh: Nấu 2 món ăn tại Bếp', type: 'cook', target: 2, rewardGold: 300, rewardStars: 2 }
    ];

    this.keys = {};
    this.hoverTile = null;
    this.isMouseDown = false;
    this.lastDraggedTileKey = null;
    this.fishingState = null;

    this.ui = new window.GameUI(this);
    this.loadGame();
    this.bindEvents();
    this.ui.updateHUD();

    this.lastTime = performance.now();
    requestAnimationFrame(t => this.loop(t));
  }

  recordDiscovery(key, qty = 1) {
    this.discovered[key] = (this.discovered[key] || 0) + qty;
  }

  bindEvents() {
    window.addEventListener('keydown', e => {
      this.keys[e.code] = true;
      if (e.code === 'Digit1') this.selectTool('smart');
      if (e.code === 'Digit2') this.selectTool('hoe');
      if (e.code === 'Digit3') this.selectTool('water');
      if (e.code === 'Digit4') this.selectTool('seed');
      if (e.code === 'Digit5') this.selectTool('scythe');
      if (e.code === 'Digit6') this.selectTool('sprinkler');
      if (e.code === 'Digit7') this.selectTool('lantern');
      if (e.code === 'Digit8') this.selectTool('rod');
      if (e.code === 'Escape') {
        this.ui.closeModal();
        this.ui.closeDaySummaryModal();
      }
      if (e.code === 'KeyQ') {
        this.ui.openModalGroup('quests');
      }
      if (e.code === 'KeyE') {
        const modal = document.getElementById('main-modal');
        if (modal.classList.contains('open')) this.ui.closeModal();
        else this.ui.openModalGroup('shop');
      }
      if (e.code === 'Space') {
        if (this.fishingState && this.fishingState.active) {
          e.preventDefault();
          this.resolveFishingStrike();
        } else {
          const r = Math.floor(this.player.y / this.world.tileSize);
          const c = Math.floor(this.player.x / this.world.tileSize);
          const tile = this.world.getTile(r, c);
          if (tile) this.interactWithTile(tile);
        }
      }
    });

    window.addEventListener('keyup', e => {
      this.keys[e.code] = false;
    });

    window.addEventListener('mouseup', () => {
      this.isMouseDown = false;
      this.lastDraggedTileKey = null;
    });

    this.canvas.addEventListener('mousemove', e => {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      const c = Math.floor(mx / this.world.tileSize);
      const r = Math.floor(my / this.world.tileSize);
      this.hoverTile = this.world.getTile(r, c);
      this.ui.updateTileInspector(this.hoverTile);

      if (this.isMouseDown && this.hoverTile) {
        const tileKey = `${this.hoverTile.r},${this.hoverTile.c}`;
        if (tileKey !== this.lastDraggedTileKey) {
          this.lastDraggedTileKey = tileKey;
          if (['grass', 'soil'].includes(this.hoverTile.type)) {
            this.interactWithTile(this.hoverTile);
          }
        }
      }
    });

    this.canvas.addEventListener('mouseleave', () => {
      this.hoverTile = null;
      this.ui.updateTileInspector(null);
    });

    this.canvas.addEventListener('mousedown', e => {
      window.SFX.startBGM();
      if (this.fishingState && this.fishingState.active) {
        this.resolveFishingStrike();
        return;
      }

      this.isMouseDown = true;

      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;

      for (const anim of this.animals) {
        if (Math.hypot(mx - anim.x, my - anim.y) <= 26) {
          this.interactWithAnimal(anim);
          return;
        }
      }

      const c = Math.floor(mx / this.world.tileSize);
      const r = Math.floor(my / this.world.tileSize);
      const tile = this.world.getTile(r, c);
      if (!tile) return;

      this.lastDraggedTileKey = `${tile.r},${tile.c}`;
      const tx = (c + 0.5) * this.world.tileSize;
      const ty = (r + 0.5) * this.world.tileSize;
      const dist = Math.hypot(this.player.x - tx, this.player.y - ty);

      if (dist <= this.world.tileSize * 3.2) {
        this.interactWithTile(tile);
      } else {
        this.player.moveTo(tx, ty, () => this.interactWithTile(tile));
      }
    });

    document.getElementById('btn-smart-mode').onclick = () => {
      this.smartMode = !this.smartMode;
      if (this.smartMode) this.selectedTool = 'smart';
      this.ui.updateHUD();
    };

    document.getElementById('step-guide-pill').onclick = () => {
      const chap = window.GAME_CONFIG.STORY_CHAPTERS.find(c => c.chapter === this.storyChapter);
      if (chap && chap.check(this)) {
        this.completeStoryChapter();
      } else {
        this.ui.openModalGroup('quests', 'story');
      }
    };

    document.getElementById('btn-menu-quests').onclick = () => this.ui.openModalGroup('quests');
    document.getElementById('btn-menu-shop').onclick = () => this.ui.openModalGroup('shop');
    document.getElementById('btn-menu-shrine').onclick = () => this.ui.openModalGroup('shrine');
    document.getElementById('btn-menu-guide').onclick = () => this.ui.openModalGroup('guide');

    document.getElementById('btn-sell-all').onclick = () => this.sellAllInventory();
    document.getElementById('btn-sleep').onclick = () => this.advanceToNextDay(false);
    document.getElementById('btn-audio').onclick = (e) => {
      const muted = window.SFX.toggleMute();
      e.currentTarget.textContent = muted ? '🔇' : '🔊';
    };

    document.getElementById('btn-close-modal').onclick = () => this.ui.closeModal();
    document.getElementById('btn-close-day-summary').onclick = () => this.ui.closeDaySummaryModal();
    document.getElementById('btn-close-dlg').onclick = () => this.ui.hideDialogue();
    document.getElementById('btn-strike-fish').onclick = () => this.resolveFishingStrike();
  }

  selectTool(toolId) {
    this.selectedTool = toolId;
    this.smartMode = (toolId === 'smart');
    this.ui.updateHUD();
  }

  useStarShopItem(itemId) {
    const item = window.GAME_CONFIG.STAR_SHOP_ITEMS.find(x => x.id === itemId);
    if (!item || this.starShards < item.starCost) return;

    if (itemId === 'instant_grow') {
      let grown = 0;
      for (let r = 0; r < this.world.rows; r++) {
        for (let c = 0; c < this.world.cols; c++) {
          const t = this.world.tiles[r][c];
          if (t.crop && t.crop.stage < 4) {
            t.crop.progress = 1;
            t.crop.stage = 4;
            t.watered = true;
            grown++;
            this.world.spawnParticles((c + 0.5) * this.world.tileSize, (r + 0.5) * this.world.tileSize, '#76ff03', 8);
          }
        }
      }
      if (grown === 0) {
        this.ui.showToast('🌱 Chưa có cây đang lớn trên cánh đồng! Hãy gieo hạt trước nhé.');
        return;
      }
      this.starShards -= item.starCost;
      this.world.checkGiantCrops();
      window.SFX.playStar();
      this.ui.showToast(`✨ Phép màu Tinh Linh! Đã làm chín tức thì ${grown} cây trồng!`);
    } else if (itemId === 'star_mutate_3') {
      const candidates = [];
      for (let r = 0; r < this.world.rows; r++) {
        for (let c = 0; c < this.world.cols; c++) {
          const t = this.world.tiles[r][c];
          if (t.crop && !t.crop.isMutated) candidates.push(t);
        }
      }
      if (candidates.length === 0) {
        this.ui.showToast('🌱 Hãy gieo cây trên đồng trước khi dùng Tinh Thể Đột Biến nhé!');
        return;
      }
      this.starShards -= item.starCost;
      candidates.slice(0, 3).forEach(t => {
        t.crop.isMutated = true;
        t.crop.stage = 4;
        t.crop.progress = 1;
        this.world.spawnParticles((t.c + 0.5) * this.world.tileSize, (t.r + 0.5) * this.world.tileSize, '#e040fb', 15);
      });
      window.SFX.playStar();
      this.ui.showToast('🌈 Đã biến cây trồng thành Cây Ánh Sao (x4 giá trị)!');
    } else if (itemId === 'summon_rain') {
      this.starShards -= item.starCost;
      this.world.weather = 'rainy';
      this.energy = Math.min(this.maxEnergy, this.energy + 50);
      for (let r = 0; r < this.world.rows; r++) {
        for (let c = 0; c < this.world.cols; c++) {
          if (this.world.tiles[r][c].type === 'soil') {
            this.world.tiles[r][c].watered = true;
          }
        }
      }
      window.SFX.playWater();
      this.ui.showToast('🌧️ Mưa Rào đã tới! Toàn bộ ô đất đã được tưới ẩm & hồi +50⚡!');
    } else if (itemId === 'summon_meteor') {
      this.summonMeteorShower();
      this.ui.closeModal();
      return;
    }

    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  completeStoryChapter() {
    const chap = window.GAME_CONFIG.STORY_CHAPTERS.find(c => c.chapter === this.storyChapter);
    if (!chap || !chap.check(this)) return;

    this.gold += chap.rewardGold;
    this.dailyStats.goldEarned += chap.rewardGold;
    this.starShards += chap.rewardStars;
    this.treeLevel = Math.min(5, this.storyChapter + 1);
    if (chap.chapter === 2) {
      this.devices.sprinkler = (this.devices.sprinkler || 0) + 1;
    }
    this.storyChapter += 1;

    window.SFX.playLevelUp();
    this.world.spawnParticles(7.5 * this.world.tileSize, 1.5 * this.world.tileSize, '#ea80fc', 28);
    this.ui.showToast(`🌟 ${chap.unlockText}`);

    const nextChap = window.GAME_CONFIG.STORY_CHAPTERS.find(c => c.chapter === this.storyChapter);
    if (nextChap) {
      this.ui.showDialogue(nextChap.npc, nextChap.introText);
    } else {
      this.ui.showDialogue('lumia', 'Chúc mừng bạn! Cây Đại Thụ Ánh Sao đã thức tỉnh hoàn toàn!');
    }

    this.ui.updateHUD();
    this.saveGame();
  }

  completeBundle(bundleId) {
    if (this.completedBundles.includes(bundleId)) return;
    const b = window.GAME_CONFIG.BUNDLES.find(x => x.id === bundleId);
    if (!b) return;

    for (const [k, q] of Object.entries(b.requirements)) {
      if ((this.inventory[k] || 0) < q) return;
    }
    for (const [k, q] of Object.entries(b.requirements)) {
      this.inventory[k] -= q;
    }

    this.completedBundles.push(bundleId);
    this.gold += b.rewardGold;
    this.dailyStats.goldEarned += b.rewardGold;
    this.starShards += b.rewardStars;
    if (b.rewardDevice) {
      this.devices[b.rewardDevice] = (this.devices[b.rewardDevice] || 0) + 1;
    }
    if (b.rewardSeed) {
      this.seeds[b.rewardSeed.id] = (this.seeds[b.rewardSeed.id] || 0) + b.rewardSeed.qty;
    }
    this.treeLevel = Math.min(5, Math.max(this.treeLevel, this.completedBundles.length + 1));
    this.addXP(65);

    window.SFX.playStar();
    this.world.spawnParticles(7.5 * this.world.tileSize, 1.5 * this.world.tileSize, '#ffd700', 26);
    this.ui.showToast(`🏛️ Đã hiến tế "${b.name}"! Nhận ${b.rewardText}`);
    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  interactWithAnimal(anim) {
    window.SFX.playPet();
    if (anim.hasProductReady) {
      anim.hasProductReady = false;
      const isGolden = anim.affection >= 2 && Math.random() < 0.5;
      const prodKey = anim.cfg.produceId;
      const qty = isGolden ? 2 : 1;
      this.inventory[prodKey] = (this.inventory[prodKey] || 0) + qty;
      this.recordDiscovery(prodKey, qty);
      this.addXP(15);
      this.world.spawnParticles(anim.x, anim.y, '#ffd700', 12);
      this.world.spawnFloatingText(
        anim.x,
        anim.y - 16,
        `+${qty} ${isGolden ? anim.cfg.goldenProduceName : anim.cfg.produceName}!`,
        '#ffd54f'
      );
      this.ui.updateHUD();
      this.saveGame();
    } else {
      anim.affection += 1;
      this.world.spawnParticles(anim.x, anim.y - 10, '#ff4081', 8);
      this.world.spawnFloatingText(anim.x, anim.y - 16, '💕 Thân thiết +1!', '#ff80ab');
    }
  }

  interactWithTile(tile) {
    this.player.actionAnimTimer = 0.25;
    const px = (tile.c + 0.5) * this.world.tileSize;
    const py = (tile.r + 0.5) * this.world.tileSize;

    if (tile.type === 'sacred_tree') {
      this.ui.openModalGroup('shrine', 'bundles');
      return;
    }
    if (tile.type === 'house_zone') {
      this.advanceToNextDay(false);
      return;
    }
    if (tile.type === 'shipping_bin') {
      this.sellAllInventory();
      return;
    }
    if (tile.type === 'kitchen_oven') {
      this.ui.openModalGroup('shrine', 'kitchen');
      return;
    }
    if (tile.type === 'water' || this.selectedTool === 'rod') {
      if (tile.type === 'water') {
        this.startFishingMinigame();
        return;
      }
    }

    if (this.selectedTool === 'sprinkler' || this.selectedTool === 'lantern') {
      const devId = this.selectedTool;
      if ((this.devices[devId] || 0) <= 0) {
        this.ui.showToast('⚠ Bạn chưa có thiết bị này! Hãy mua trong Cửa Hàng.');
        return;
      }
      if (tile.device || tile.obstacle) {
        this.ui.showToast('⚠ Ô đất này đang vướng vật cản!');
        return;
      }
      this.devices[devId] -= 1;
      tile.device = devId;
      window.SFX.playPlant();
      this.world.spawnParticles(px, py, '#4fc3f7', 10);
      this.ui.updateHUD();
      this.saveGame();
      return;
    }

    if (tile.obstacle) {
      if (!this.consumeEnergy(1.5)) return;
      tile.obstacle = null;
      this.addXP(5);
      window.SFX.playHoe();
      this.world.spawnParticles(px, py, '#a5d6a7', 10);
      this.world.spawnFloatingText(px, py - 8, '+5 XP Dọn đất!', '#a5d6a7');
      this.ui.updateHUD();
      return;
    }

    if (this.smartMode || this.selectedTool === 'smart') {
      if (tile.crop && tile.crop.stage === 4) {
        this.harvestTile(tile, false);
      } else if (tile.type === 'grass') {
        this.useHoeOnTile(tile);
      } else if (tile.type === 'soil' && !tile.crop) {
        if ((this.seeds[this.selectedSeed] || 0) > 0) {
          this.plantSeedOnTile(tile);
        } else if (!tile.watered) {
          this.waterTile(tile);
        } else {
          this.checkSoftlockRelief();
          this.ui.showToast('🌱 Hết hạt giống đang chọn! Hãy chọn hạt khác ở góc trái trên hoặc mở Cửa Hàng.');
        }
      } else if (tile.type === 'soil' && tile.crop && !tile.watered) {
        this.waterTile(tile);
      }
      return;
    }

    if (this.selectedTool === 'hoe') this.useHoeOnTile(tile);
    else if (this.selectedTool === 'water') this.waterTile(tile);
    else if (this.selectedTool === 'seed') this.plantSeedOnTile(tile);
    else if (this.selectedTool === 'scythe' && tile.crop && tile.crop.stage === 4) {
      this.harvestTile(tile, false);
    }
  }

  useHoeOnTile(centerTile) {
    if (!this.consumeEnergy(1.5)) return;
    const radius = this.upgrades.hoe_2 ? 1 : 0;
    let count = 0;
    for (let dr = -radius; dr <= radius; dr++) {
      for (let dc = -radius; dc <= radius; dc++) {
        const t = this.world.getTile(centerTile.r + dr, centerTile.c + dc);
        if (t && t.type === 'grass' && !t.obstacle) {
          t.type = 'soil';
          count++;
          this.world.spawnParticles((t.c + 0.5) * this.world.tileSize, (t.r + 0.5) * this.world.tileSize, '#b57c4a', 6);
        }
      }
    }
    if (count > 0) {
      window.SFX.playHoe();
      this.addXP(count * 2);
      this.ui.updateHUD();
      this.saveGame();
    }
  }

  plantSeedOnTile(tile) {
    if (tile.type !== 'soil' || tile.crop) return;
    const seedId = this.selectedSeed;
    if ((this.seeds[seedId] || 0) <= 0) {
      this.checkSoftlockRelief();
      this.ui.showToast('🌱 Đã hết hạt giống loại này! Hãy ghé Cửa Hàng mua thêm.');
      return;
    }
    this.seeds[seedId] -= 1;
    tile.crop = { id: seedId, stage: 0, progress: 0, isMutated: false, isGiant: false };
    window.SFX.playPlant();
    const px = (tile.c + 0.5) * this.world.tileSize;
    const py = (tile.r + 0.5) * this.world.tileSize;
    this.world.spawnParticles(px, py, '#ffe082', 6);
    if (this.smartMode && !tile.watered && this.energy >= 1.5) {
      this.waterTile(tile);
    }
    this.ui.updateHUD();
    this.saveGame();
  }

  waterTile(centerTile) {
    if (!this.consumeEnergy(1.0)) return;
    const radius = this.upgrades.watering_can_2 ? 1 : 0;
    let wateredAny = false;
    for (let dr = -radius; dr <= radius; dr++) {
      for (let dc = -radius; dc <= radius; dc++) {
        const t = this.world.getTile(centerTile.r + dr, centerTile.c + dc);
        if (t && t.type === 'soil' && !t.watered) {
          t.watered = true;
          wateredAny = true;
          this.world.spawnParticles((t.c + 0.5) * this.world.tileSize, (t.r + 0.5) * this.world.tileSize, '#4fc3f7', 7);
        }
      }
    }
    if (wateredAny) {
      window.SFX.playWater();
      this.addXP(2);
      this.ui.updateHUD();
      this.saveGame();
    }
  }

  harvestTile(tile, byCat = false) {
    if (!tile.crop || tile.crop.stage < 4) return;
    const cfg = window.GAME_CONFIG.CROPS[tile.crop.id];
    const px = (tile.c + 0.5) * this.world.tileSize;
    const py = (tile.r + 0.5) * this.world.tileSize;

    const yieldQty = tile.crop.isGiant ? 3 : 1;
    const isMutated = tile.crop.isMutated;

    this.inventory[cfg.id] = (this.inventory[cfg.id] || 0) + yieldQty;
    this.recordDiscovery(cfg.id, yieldQty);
    this.stats.harvested += yieldQty;
    this.dailyStats.harvested += yieldQty;

    if (isMutated || tile.crop.isGiant) {
      this.stats.mutatedHarvested += 1;
      const bonusGold = Math.round(cfg.sellPrice * (isMutated ? 2.5 : 1.5));
      this.gold += bonusGold;
      this.dailyStats.goldEarned += bonusGold;
      this.starShards += isMutated ? 1 : 0;
      this.world.spawnFloatingText(px, py - 24, `🌟 ĐỘT BIẾN +${bonusGold}G!`, '#e040fb');
    }

    this.addXP(cfg.xp * yieldQty);
    window.SFX.playHarvest();
    this.world.spawnParticles(px, py, cfg.color, 14);
    this.world.spawnFloatingText(
      px,
      py - 8,
      `${byCat ? '🐱 Mèo thu ' : ''}+${yieldQty} ${cfg.name}`,
      '#fff59d'
    );

    if (cfg.regrow) {
      tile.crop.stage = cfg.regrowStage || 2;
      tile.crop.progress = 0.5;
      tile.crop.isMutated = false;
      tile.crop.isGiant = false;
      tile.watered = false;
    } else {
      tile.crop = null;
      tile.watered = false;
    }

    this.ui.updateHUD();
    this.saveGame();
  }

  startFishingMinigame() {
    if (!this.consumeEnergy(4)) return;
    const uiBox = document.getElementById('fishing-bar-ui');
    const sweet = document.getElementById('fish-sweet-spot');
    const sweetLeft = 22 + Math.random() * 45;
    const sweetWidth = 25;

    sweet.style.left = `${sweetLeft}%`;
    sweet.style.width = `${sweetWidth}%`;
    uiBox.classList.add('active');

    this.fishingState = {
      active: true,
      cursor: 0,
      dir: 1,
      speed: 92,
      sweetMin: sweetLeft,
      sweetMax: sweetLeft + sweetWidth
    };
  }

  resolveFishingStrike() {
    if (!this.fishingState || !this.fishingState.active) return;
    const st = this.fishingState;
    st.active = false;
    document.getElementById('fishing-bar-ui').classList.remove('active');

    if (st.cursor >= st.sweetMin && st.cursor <= st.sweetMax) {
      window.SFX.playHarvest();
      this.stats.fishCaught += 1;
      const winterBonus = this.world.getCurrentSeason().id === 'winter' ? 2 : 1;
      this.inventory.fish = (this.inventory.fish || 0) + winterBonus;
      this.recordDiscovery('fish', winterBonus);
      this.addXP(25);
      if (Math.random() < 0.35) {
        this.starShards += 1;
        this.gold += 85;
        this.dailyStats.goldEarned += 85;
        this.ui.showToast(`🎣 Câu được +${winterBonus} Cá Chép Koi & Rương Kho Báu (+85G, +1 🌠 Sao)!`);
      } else {
        this.ui.showToast(`🐟 Cắn câu chuẩn xác! +${winterBonus} Cá Chép Koi vào Kho!`);
      }
    } else {
      window.SFX.playHoe();
      this.ui.showToast('💦 Cá vùng thoát mất rồi! Hãy canh đúng vạch xanh lá nhé.');
    }
    this.ui.updateHUD();
    this.saveGame();
  }

  buySeed(cropId, qty) {
    const cfg = window.GAME_CONFIG.CROPS[cropId];
    const cost = cfg.seedPrice * qty;
    if (this.gold < cost) {
      this.ui.showToast('⚠ Không đủ Vàng! Hãy bán nông sản trước nhé.');
      return;
    }
    this.gold -= cost;
    this.seeds[cropId] = (this.seeds[cropId] || 0) + qty;
    this.selectedSeed = cropId;
    window.SFX.playCoin();
    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  buyAnimal(typeId) {
    const cfg = window.GAME_CONFIG.ANIMALS[typeId];
    if (this.gold < cfg.price) {
      this.ui.showToast('⚠ Không đủ Vàng để nhận nuôi!');
      return;
    }
    this.gold -= cfg.price;
    const ax = 480 + Math.random() * 200;
    const ay = 110 + Math.random() * 140;
    this.animals.push(new window.FarmAnimal(typeId, ax, ay));
    window.SFX.playLevelUp();
    this.ui.showToast(`🎉 Đã đón ${cfg.icon} ${cfg.name} về nông trại!`);
    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  buyDevice(devId) {
    const cfg = window.GAME_CONFIG.DEVICES[devId];
    if (this.gold < cfg.price) {
      this.ui.showToast('⚠ Không đủ Vàng!');
      return;
    }
    this.gold -= cfg.price;
    this.devices[devId] = (this.devices[devId] || 0) + 1;
    this.selectTool(devId);
    window.SFX.playCoin();
    this.ui.showToast(`🛠️ Đã mua ${cfg.name}! Di chuột lên bản đồ để lắp đặt.`);
    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  buyUpgrade(upId) {
    const up = window.GAME_CONFIG.UPGRADES.find(u => u.id === upId);
    if (!up || this.upgrades[upId]) return;
    if (this.gold < up.price) {
      this.ui.showToast('⚠ Không đủ Vàng để nâng cấp!');
      return;
    }
    this.gold -= up.price;
    this.upgrades[upId] = true;
    if (upId === 'cat_skill') this.cat.upgraded = true;
    window.SFX.playLevelUp();
    this.ui.showToast(`🌟 Nâng cấp thành công: ${up.name}!`);
    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  cookRecipe(recipe, eatNow) {
    for (const [k, q] of Object.entries(recipe.ingredients)) {
      if ((this.inventory[k] || 0) < q) return;
    }
    for (const [k, q] of Object.entries(recipe.ingredients)) {
      this.inventory[k] -= q;
    }
    this.stats.dishesCooked += 1;
    this.recordDiscovery(recipe.id, 1);
    this.addXP(30);

    if (eatNow) {
      this.energy = Math.min(this.maxEnergy, this.energy + recipe.energyRestore);
      this.player.speedBoostTimer = 45;
      window.SFX.playLevelUp();
      this.ui.showToast(`😋 Ăn ${recipe.icon} ${recipe.name}: Hồi +${recipe.energyRestore}⚡ & Tăng tốc!`);
    } else {
      const earned = Math.round(recipe.sellPrice * this.getPriceMultiplier());
      this.gold += earned;
      this.dailyStats.goldEarned += earned;
      window.SFX.playCoin();
      this.ui.showToast(`💰 Đã bán ${recipe.icon} ${recipe.name} thu về +${earned}G!`);
    }
    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  getPriceMultiplier() {
    let mult = 1.0 + (this.treeLevel - 1) * 0.12;
    if (this.upgrades.greenhouse_charm) mult += 0.35;
    if (this.storyChapter > 5) mult += 0.25;
    return mult;
  }

  getItemLabel(key) {
    if (window.GAME_CONFIG.CROPS[key]) return window.GAME_CONFIG.CROPS[key].name;
    const map = { egg: 'Trứng Gà Tươi', milk: 'Sữa Tươi', honey: 'Mật Ong Rừng', fish: 'Cá Chép Koi' };
    return map[key] || key;
  }

  getItemIcon(key) {
    if (window.GAME_CONFIG.CROPS[key]) return window.GAME_CONFIG.CROPS[key].emoji;
    const map = { egg: '🥚', milk: '🥛', honey: '🍯', fish: '🐟' };
    return map[key] || '📦';
  }

  getItemSellPrice(key) {
    let mult = this.getPriceMultiplier();
    const season = this.world.getCurrentSeason();
    if (season.id === 'autumn' && (key === 'pumpkin' || key === 'eggplant')) {
      mult += 0.25;
    }
    if (window.GAME_CONFIG.CROPS[key]) {
      return Math.round(window.GAME_CONFIG.CROPS[key].sellPrice * mult);
    }
    const base = { egg: 48, milk: 115, honey: 90, fish: 95 }[key] || 30;
    return Math.round(base * mult);
  }

  sellInventoryItem(key) {
    const qty = this.inventory[key] || 0;
    if (qty <= 0) return;
    const total = qty * this.getItemSellPrice(key);
    this.inventory[key] = 0;
    this.gold += total;
    this.dailyStats.goldEarned += total;
    window.SFX.playCoin();
    this.ui.showToast(`💰 Đã bán ${qty} ${this.getItemLabel(key)} (+${total.toLocaleString('vi-VN')}G)!`);
    this.ui.updateHUD();
    this.ui.renderModalContent();
    this.saveGame();
  }

  sellAllInventory() {
    let total = 0;
    Object.keys(this.inventory).forEach(k => {
      const qty = this.inventory[k] || 0;
      if (qty > 0) {
        total += qty * this.getItemSellPrice(k);
        this.inventory[k] = 0;
      }
    });
    if (total === 0) {
      this.ui.showToast('📦 Kho nông sản đang trống! Hãy thu hoạch cây chín trước nhé.');
      return;
    }
    this.gold += total;
    this.dailyStats.goldEarned += total;
    window.SFX.playCoin();
    this.world.spawnParticles(4.5 * this.world.tileSize, 2.5 * this.world.tileSize, '#ffd700', 22);
    this.ui.showToast(`🚚 Đã bán toàn bộ nông sản: +${total.toLocaleString('vi-VN')} Vàng!`);
    this.ui.updateHUD();
    this.saveGame();
  }

  checkSoftlockRelief() {
    const totalSeeds = Object.values(this.seeds).reduce((a, b) => a + b, 0);
    const totalInv = Object.values(this.inventory).reduce((a, b) => a + b, 0);
    let plantedCount = 0;
    for (let r = 0; r < this.world.rows; r++) {
      for (let c = 0; c < this.world.cols; c++) {
        if (this.world.tiles[r][c].crop) plantedCount++;
      }
    }
    if (this.gold < 15 && totalSeeds === 0 && totalInv === 0 && plantedCount === 0) {
      this.seeds.radish = 4;
      this.selectedSeed = 'radish';
      this.ui.showDialogue('bamai', 'Bà Mai tặng cháu 4 túi hạt Củ Cải Đỏ miễn phí để tiếp tục canh tác nhé!');
      this.ui.updateHUD();
    }
  }

  getQuestProgress(q) {
    if (q.type === 'harvest') return this.stats.harvested;
    if (q.type === 'mutated') return this.stats.mutatedHarvested;
    if (q.type === 'fish') return this.stats.fishCaught;
    if (q.type === 'cook') return this.stats.dishesCooked;
    return 0;
  }

  claimQuest(qId) {
    const idx = this.quests.findIndex(q => q.id === qId);
    if (idx === -1) return;
    const q = this.quests[idx];
    this.gold += q.rewardGold;
    this.dailyStats.goldEarned += q.rewardGold;
    this.starShards += q.rewardStars;
    this.addXP(45);
    window.SFX.playLevelUp();
    this.ui.showToast(`🎁 Hoàn thành ủy thác! +${q.rewardGold}G & +${q.rewardStars} 🌠 Sao!`);

    q.target = Math.round(q.target * 1.7) + 2;
    q.rewardGold = Math.round(q.rewardGold * 1.5);
    this.ui.updateHUD();
    this.saveGame();
  }

  summonMeteorShower() {
    if (this.starShards < 2) {
      this.ui.showToast('🌠 Cần 2 Mảnh Sao Băng để triệu hồi Đêm Mưa Sao Băng!');
      return;
    }
    this.starShards -= 2;
    this.world.weather = 'meteor';
    this.world.timeOfDay = 0.80;
    window.SFX.playStar();
    this.world.triggerMeteorImpact();
    setTimeout(() => this.world.triggerMeteorImpact(), 850);
    this.ui.showToast('🌠 ĐÊM MƯA SAO BĂNG ĐÃ BẮT ĐẦU!');
    this.ui.updateHUD();
  }

  advanceToNextDay(autoFromClock = false) {
    const endedDay = this.world.day;
    const goldToday = this.dailyStats.goldEarned;
    const harvToday = this.dailyStats.harvested;

    this.world.day += 1;
    this.world.timeOfDay = 0.26;
    this.energy = this.maxEnergy;
    this.dailyStats = { goldEarned: 0, harvested: 0 };

    const newSeasonIdx = Math.floor((this.world.day - 1) / window.GAME_CONFIG.DAYS_PER_SEASON) % 4;
    this.world.seasonIndex = newSeasonIdx;

    const r = Math.random();
    if (r < 0.30) {
      this.world.weather = 'rainy';
    } else if (r < 0.48 || this.upgrades.greenhouse_charm || this.world.getCurrentSeason().id === 'winter') {
      this.world.weather = 'meteor';
    } else {
      this.world.weather = 'sunny';
    }

    for (let row = 0; row < this.world.rows; row++) {
      for (let col = 0; col < this.world.cols; col++) {
        const t = this.world.tiles[row][col];
        if (t.crop && t.watered && t.crop.stage < 4) {
          t.crop.progress = Math.min(1, t.crop.progress + 0.45);
          t.crop.stage = Math.min(4, Math.floor(t.crop.progress * 4));
        }
        if (this.world.weather !== 'rainy') {
          t.watered = false;
        } else if (t.type === 'soil') {
          t.watered = true;
        }
      }
    }
    this.world.checkGiantCrops();
    this.checkSoftlockRelief();

    window.SFX.playLevelUp();
    const s = this.world.getCurrentSeason();
    if (!autoFromClock) {
      this.ui.showDaySummaryModal({
        endedDay,
        newDay: this.world.day,
        seasonName: `${s.icon} ${s.name}`,
        goldEarnedToday: goldToday,
        harvestedToday: harvToday,
        nextWeather: this.world.weather
      });
    } else {
      this.ui.showToast(`🌅 Bước sang Ngày ${this.world.day}! Năng lượng đã hồi 100%!`);
    }

    this.ui.updateHUD();
    this.saveGame();
  }

  consumeEnergy(amount) {
    const discount = this.storyChapter >= 4 ? 0.75 : 1.0;
    const finalCost = amount * discount;
    if (this.energy < finalCost) {
      this.ui.showToast('😴 Hết năng lượng! Hãy bấm "🌙 Ngủ" ở góc dưới để sang ngày mới nhé!');
      return false;
    }
    this.energy -= finalCost;
    return true;
  }

  addXP(amount) {
    this.xp += amount;
    if (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level += 1;
      this.xpToNext = Math.round(this.xpToNext * 1.35);
      this.maxEnergy += 15;
      this.energy = this.maxEnergy;
      this.gold += this.level * 50;
      window.SFX.playLevelUp();
      this.ui.showToast(`🎉 LÊN CẤP ${this.level}! Năng lượng tối đa +15 & Thưởng +${this.level * 50}G!`);
    }
  }

  exportSaveJson() {
    this.saveGame();
    const raw = localStorage.getItem('starlight_valley_save_v4') || '{}';
    const blob = new Blob([raw], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `thung_lung_sao_bang_day_${this.world.day}.json`;
    a.click();
    URL.revokeObjectURL(url);
    this.ui.showToast('💾 Đã tải file bản lưu (.json) về máy!');
  }

  resetGameData() {
    localStorage.removeItem('starlight_valley_save_v4');
    localStorage.removeItem('starlight_valley_save_v3');
    localStorage.removeItem('starlight_valley_save_v2');
    window.location.reload();
  }

  saveGame() {
    try {
      const data = {
        gold: this.gold,
        starShards: this.starShards,
        energy: this.energy,
        maxEnergy: this.maxEnergy,
        level: this.level,
        xp: this.xp,
        xpToNext: this.xpToNext,
        storyChapter: this.storyChapter,
        treeLevel: this.treeLevel,
        completedBundles: this.completedBundles,
        seeds: this.seeds,
        devices: this.devices,
        upgrades: this.upgrades,
        inventory: this.inventory,
        discovered: this.discovered,
        stats: this.stats,
        day: this.world.day,
        seasonIndex: this.world.seasonIndex,
        tiles: this.world.tiles,
        animalTypes: this.animals.map(a => a.typeId)
      };
      localStorage.setItem('starlight_valley_save_v4', JSON.stringify(data));
    } catch (e) {}
  }

  loadGame() {
    try {
      const raw =
        localStorage.getItem('starlight_valley_save_v4') ||
        localStorage.getItem('starlight_valley_save_v3') ||
        localStorage.getItem('starlight_valley_save_v2');
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (data && data.tiles && data.tiles.length === this.world.rows) {
        this.gold = data.gold ?? this.gold;
        this.starShards = data.starShards ?? this.starShards;
        this.energy = data.energy ?? this.energy;
        this.maxEnergy = data.maxEnergy ?? this.maxEnergy;
        this.level = data.level ?? this.level;
        this.xp = data.xp ?? this.xp;
        this.xpToNext = data.xpToNext ?? this.xpToNext;
        this.storyChapter = data.storyChapter ?? 1;
        this.treeLevel = data.treeLevel ?? 1;
        this.completedBundles = data.completedBundles || [];
        this.seeds = { ...this.seeds, ...(data.seeds || {}) };
        this.devices = { ...this.devices, ...(data.devices || {}) };
        this.upgrades = data.upgrades || {};
        this.inventory = data.inventory || {};
        this.discovered = { ...this.discovered, ...(data.discovered || {}) };
        this.stats = { ...this.stats, ...(data.stats || {}) };
        this.world.day = data.day || 1;
        this.world.seasonIndex = data.seasonIndex || 0;
        this.world.tiles = data.tiles;
        if (this.upgrades.cat_skill) this.cat.upgraded = true;
        if (Array.isArray(data.animalTypes) && data.animalTypes.length > 0) {
          this.animals = data.animalTypes.map(t => new window.FarmAnimal(t, 480 + Math.random() * 180, 110 + Math.random() * 140));
        }
        return true;
      }
    } catch (e) {}
    return false;
  }

  loop(now) {
    const dt = Math.min(0.05, (now - this.lastTime) / 1000);
    this.lastTime = now;
    const timeSec = now / 1000;

    this.world.update(dt, this);
    this.player.update(dt, this.keys, this.canvas.width, this.canvas.height);
    this.cat.update(dt, this.player, this);
    for (const anim of this.animals) {
      anim.update(dt);
    }

    if (this.fishingState && this.fishingState.active) {
      this.fishingState.cursor += this.fishingState.dir * this.fishingState.speed * dt;
      if (this.fishingState.cursor >= 96) {
        this.fishingState.cursor = 96;
        this.fishingState.dir = -1;
      } else if (this.fishingState.cursor <= 0) {
        this.fishingState.cursor = 0;
        this.fishingState.dir = 1;
      }
      document.getElementById('fish-cursor').style.left = `${this.fishingState.cursor}%`;
    }

    if (Math.floor(timeSec * 2) !== this.lastHudTick) {
      this.lastHudTick = Math.floor(timeSec * 2);
      document.getElementById('hud-clock').textContent = this.world.getFormattedClock();
    }

    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.world.render(this.ctx, timeSec, this.hoverTile, this.treeLevel, this);

    for (const anim of this.animals) {
      anim.render(this.ctx, timeSec);
    }
    this.cat.render(this.ctx, timeSec);
    this.player.render(this.ctx);

    this.world.renderWeatherAndLighting(this.ctx, this.canvas.width, this.canvas.height, timeSec);

    requestAnimationFrame(t => this.loop(t));
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.GAME = new StarlightFarmGame();
});

</script>
</body>
</html>
